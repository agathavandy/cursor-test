<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="節慶貼文精選 — 一年中的重要時刻與祝福">
  <title>節慶貼文 | Festive Posts</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-header__eyebrow">Seasonal Highlights</p>
      <h1 class="site-header__title">節慶貼文精選</h1>
      <p class="site-header__lead">與重要的人分享每個節日的溫度與祝福</p>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      <section class="card-grid" aria-label="節慶貼文列表">
        <article class="card">
          <div class="card__media">
            <img src="assets/images/p1.jpg" alt="農曆新年燈籠與煙火" width="400" height="260" loading="lazy">
          </div>
          <div class="card__body">
            <h2 class="card__title">農曆新年</h2>
            <p class="card__text">爆竹聲中一歲除，春風送暖入屠蘇。貼上春聯、準備年菜，向家人朋友送上「恭喜發財、萬事如意」的新年祝福。</p>
          </div>
        </article>

        <article class="card">
          <div class="card__media">
            <img src="assets/images/p2.jpg" alt="端午節龍舟與粽子" width="400" height="260" loading="lazy">
          </div>
          <div class="card__body">
            <h2 class="card__title">端午節</h2>
            <p class="card__text">粽葉飄香、龍舟競渡，紀念屈原的傳統節日。包一顆熱騰騰的粽子，與親友分享「端午安康」的問候。</p>
          </div>
        </article>

        <article class="card">
          <div class="card__media">
            <img src="assets/images/p3.jpg" alt="中秋節滿月與月餅" width="400" height="260" loading="lazy">
          </div>
          <div class="card__body">
            <h2 class="card__title">中秋節</h2>
            <p class="card__text">明月幾時有，把酒問青天。賞月、烤肉、品嚐月餅，在團圓的夜晚裡，傳遞「人長久、千里共嬋娟」的心意。</p>
          </div>
        </article>

        <article class="card">
          <div class="card__media">
            <img src="assets/images/p4.jpg" alt="聖誕節聖誕樹與禮物" width="400" height="260" loading="lazy">
          </div>
          <div class="card__body">
            <h2 class="card__title">聖誕節</h2>
            <p class="card__text">燈飾點亮街道，交換禮物與卡片。無論是聚會或靜謐夜晚，願你收到滿滿的溫暖與「聖誕快樂、新年平安」。</p>
          </div>
        </article>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 節慶貼文 · 用心傳遞每個值得紀念的日子</p>
    </div>
  </footer>
</body>
</html>
